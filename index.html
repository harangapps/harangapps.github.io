<!DOCTYPE html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harang Apps · 하랑 앱스</title>
<meta name="description" content="Harang - simple, friendly Chrome extensions and mini games. 하랑 - 가볍고 친근한 크롬 확장프로그램과 미니게임.">
<link rel="icon" href="brand/harang-mark-32.png">
<link rel="apple-touch-icon" href="brand/harang-mark-192.png">
<link rel="canonical" href="https://harangapps.github.io/">
<meta property="og:title" content="Harang Apps"><meta property="og:image" content="https://harangapps.github.io/brand/harang-logo.png">
<style>
  :root { --bg:#f7f6fb; --card:#fff; --ink:#26233a; --muted:#6d6a82; --accent:#ff6a2c; --accent2:#ffb21e; --line:#e6e3f2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  header { background:linear-gradient(135deg,#1d1b26,#34303f); color:#fff; padding:56px 20px 64px; text-align:center; position:relative; }
  header h1 { margin:0 0 8px; font-size:2.2rem; letter-spacing:6px; display:flex; align-items:center; justify-content:center; gap:12px; }
  header h1 img { width:64px; height:64px; background:#fff; border-radius:16px; padding:4px; }
  header p { margin:0; opacity:.92; font-size:1.05rem; }
  .lang { position:absolute; top:14px; right:16px; }
  .lang button { background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:20px; padding:4px 12px; cursor:pointer; font-size:.85rem; }
  .lang button[aria-pressed="true"] { background:#fff; color:var(--accent); }
  main { max-width:1000px; margin:-32px auto 0; padding:0 16px 40px; }
  h2 { font-size:1.25rem; margin:36px 4px 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:8px; box-shadow:0 2px 10px rgba(60,50,120,.05); }
  .card .top { display:flex; align-items:center; gap:12px; }
  .card .ic { width:56px; height:56px; border-radius:14px; flex:none; }
  .card .ic.emoji { display:grid; place-items:center; font-size:2rem; background:#fff1e6; }
  a.card.recipe { text-decoration:none; color:inherit; transition:transform .15s; } a.card.recipe:hover { transform:translateY(-2px); }
  .tag.soon-tag { color:#8a5a00; background:#fff1d0; }
  .card h3 { margin:0; font-size:1.05rem; }
  .tag { display:inline-block; font-size:.72rem; font-weight:600; color:#1f7a4d; background:#e3f6ec; border-radius:10px; padding:1px 8px; }
  .card p { margin:0; color:var(--muted); font-size:.92rem; flex:1; }
  .card .links { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .btn { font-size:.85rem; text-decoration:none; border-radius:10px; padding:6px 12px; border:1px solid var(--line); color:var(--ink); background:#fff; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.soon { background:#f0eff5; color:var(--muted); pointer-events:none; }
  #news .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:10px; }
  #news .date { color:var(--muted); font-size:.8rem; }
  #news .item b { display:block; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:30px 16px 40px; border-top:1px solid var(--line); }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="lang"><button data-l="ko">한국어</button> <button data-l="en">English</button></div>
  <h1><img src="brand/harang-mark.svg" alt="">HARANG</h1>
  <p data-ko="가볍고 친근한 크롬 확장프로그램과 미니게임" data-en="Simple, friendly Chrome extensions and mini games"></p>
</header>

<main>
  <h2 data-ko="🆓 무료 확장프로그램" data-en="🆓 Free extensions"></h2>
  <div class="grid" id="products"></div>

  <h2 data-ko="🍳 쉬운 한식 맛보기" data-en="🍳 Easy Korean Home Cooking"></h2>
  <div class="grid">
    <a class="card recipe" href="recipes/bulgogi.html?from=home">
      <div class="top"><div class="ic emoji">🥩</div><div><h3 data-ko="쉬운 불고기" data-en="Easy Bulgogi"></h3><span class="tag" data-ko="15분" data-en="15 min"></span></div></div>
      <p data-ko="간장·설탕·마늘·참기름이면 OK. 동네 마트 재료로 만드는 한국의 대표 요리." data-en="Soy sauce, sugar, garlic and sesame oil — Korea’s favorite beef dish with supermarket ingredients."></p>
    </a>
  </div>

  <h2 id="kchef" data-ko="🍲 곧 나와요" data-en="🍲 Coming soon"></h2>
  <div class="grid">
    <div class="card">
      <div class="top"><div class="ic emoji">👩‍🍳</div><div><h3 data-ko="하랑 K-셰프 빌리지" data-en="Harang K-Chef Village"></h3><span class="tag soon-tag" data-ko="준비 중" data-en="In progress"></span></div></div>
      <p data-ko="농장에서 재료를 키우고 김치·비빔밥·잡채를 만들어 마을을 키우는 한식 요리 게임. 게임에서 만든 요리는 집에서 따라 할 수 있는 진짜 레시피 카드가 열려요." data-en="A cozy Korean cooking game: grow ingredients, cook kimchi, bibimbap and japchae, and grow your village. Every dish you make unlocks a real recipe card you can cook at home."></p>
    </div>
  </div>

  <noscript><p><a href="ko/number-baseball.html">하랑 숫자야구</a> · <a href="ko/sudoku.html">하랑 스도쿠</a> · <a href="en/number-baseball.html">Number Baseball</a> · <a href="en/sudoku.html">Sudoku</a></p></noscript>
  <h2 data-ko="📰 하랑 소식" data-en="📰 Harang News"></h2>
  <div id="news"></div>
</main>

<footer>
  <p><a href="privacy.html" data-ko="개인정보처리방침" data-en="Privacy Policy"></a> · <a href="mailto:infedo09@naver.com">infedo09@naver.com</a></p>
  <p>© 2026 Harang</p>
</footer>

<script>
// ▼ 웹스토어 승인 후 store 칸에 주소만 넣으면 "설치하기" 버튼이 켜져요
const PRODUCTS = [
  { id:'baseball', e:'⚾', name:{ ko:'하랑 숫자야구', en:'Harang Number Baseball' }, desc:{ ko:'숨은 숫자를 맞히는 두뇌 게임. 스트라이크·볼 힌트로 추리해 보세요.', en:'Guess the hidden number using strike & ball hints. A quick brain teaser.' }, store:'https://chromewebstore.google.com/detail/hdjhalhafmmkkjnajlgbmdakehkbhloj', page:'number-baseball' },
  { id:'puzzle',   e:'🧩', name:{ ko:'하랑 슬라이딩 퍼즐', en:'Harang Sliding Puzzle' }, desc:{ ko:'타일을 밀어 순서대로 맞추는 클래식 퍼즐.', en:'The classic slide-the-tiles puzzle.' }, store:'' },
  { id:'volume',   e:'🔊', name:{ ko:'하랑 볼륨 부스터', en:'Harang Volume Booster' }, desc:{ ko:'작게 들리는 탭 소리를 최대 600%까지 키워요.', en:'Boost the volume of any tab up to 600%.' }, store:'' },
  { id:'sudoku',   e:'🔢', name:{ ko:'하랑 스도쿠', en:'Harang Sudoku' }, desc:{ ko:'난이도별로 즐기는 스도쿠. 사이드패널에서 바로.', en:'Sudoku with multiple difficulty levels, right in the side panel.' }, store:'https://chromewebstore.google.com/detail/fogalepipjgfmhaigknlciojcfmldagf', page:'sudoku' },
  { id:'allcalc',  e:'🧮', name:{ ko:'하랑 AllCalc', en:'Harang AllCalc' }, desc:{ ko:'계산기와 단위 변환을 한곳에. 나라별 단위도 지원해요.', en:'Calculator and unit converter in one, including regional units.' }, store:'' },
  { id:'reversi',  e:'⚫', name:{ ko:'하랑 리버시', en:'Harang Reversi' }, desc:{ ko:'돌을 뒤집어 판을 차지하는 전략 게임. 여러 판 크기 지원.', en:'Flip discs to take the board. Several board sizes.' }, store:'' },
  { id:'komok',    e:'⚪', name:{ ko:'하랑 K-Omok', en:'Harang K-Omok' }, desc:{ ko:'다섯 개를 먼저 잇는 한국식 오목.', en:'Korean-style five-in-a-row (Omok).' }, store:'https://chromewebstore.google.com/detail/alfljjknfdkmfceafblacmcjmpdegibj' },
  { id:'kyut',     e:'🎋', name:{ ko:'하랑 K-Yut', en:'Harang K-Yut' }, desc:{ ko:'가마니 위에서 즐기는 전통 윷놀이. 청팀 vs 홍팀!', en:'Traditional Korean Yut on a straw mat — play against Team Korea.' }, store:'' }
];

let lang = (localStorage.getItem('lang') || (navigator.language || 'en')).startsWith('ko') ? 'ko' : 'en';

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach((el) => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === lang));
  const L = lang === 'ko'
    ? { free:'무료', install:'설치하기', soon:'곧 출시', privacy:'개인정보', more:'자세히' }
    : { free:'Free', install:'Install', soon:'Coming soon', privacy:'Privacy', more:'Details' };
  document.getElementById('products').innerHTML = PRODUCTS.map((p) => `
    <div class="card" id="${p.id}">
      <div class="top"><img class="ic" src="icons/${p.id}.png" alt=""><div><h3>${p.name[lang]}</h3><span class="tag">${L.free}</span></div></div>
      <p>${p.desc[lang]}</p>
      <div class="links">
        ${p.store ? `<a class="btn primary" href="${p.store}" target="_blank" rel="noopener">${L.install}</a>` : `<span class="btn soon">${L.soon}</span>`}
        ${p.page ? `<a class="btn" href="${lang}/${p.page}.html">${L.more}</a>` : ''}
        <a class="btn" href="privacy.html#${p.id}">${L.privacy}</a>
      </div>
    </div>`).join('');
  renderNews();
}

let NEWS = null;
function renderNews() {
  const box = document.getElementById('news');
  if (!NEWS) { box.innerHTML = ''; return; }
  const pick = (o) => (o && (o[lang] || o.en || o.ko)) || '';
  box.innerHTML = NEWS.items.slice(0, 5).map((n) => `
    <div class="item"><span class="date">${n.date}</span><b>${pick(n.title)}</b><span>${pick(n.body)}</span></div>`).join('');
}

document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => { lang = b.dataset.l; localStorage.setItem('lang', lang); render(); });
fetch('news.json', { cache:'no-store' }).then((r) => r.json()).then((j) => { NEWS = j; renderNews(); }).catch(() => {});
render();
</script>
</body>
</html>
